repos:
  - repo: local
    hooks:
      - id: python-format-check
        name: Python format check
        entry: python scripts/run_python_gate.py -m black --check .
        language: system
        pass_filenames: false
        types_or: [python]

      - id: django-system-check
        name: Django system check
        entry: python scripts/run_python_gate.py manage.py check
        language: system
        pass_filenames: false
        types_or: [python]

      - id: frontend-format-check
        name: Frontend format check
        entry: python scripts/run_frontend_gate.py format
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: frontend-tests
        name: Frontend tests
        entry: python scripts/run_frontend_gate.py test
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: readme-validation
        name: README boundary validation
        entry: python scripts/validate_readmes.py --root . --warnings-as-errors
        language: system
        pass_filenames: false
        always_run: true
