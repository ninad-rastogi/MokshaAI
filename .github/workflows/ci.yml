name: Production gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python-and-frontend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: moksha
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moksha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: moksha.settings_test
      DJANGO_SECRET_KEY: ci-check-only-long-random-secret-with-enough-entropy-2026-08-08
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: moksha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PROJECT_ENVIRONMENT: .venv
      UV_CACHE_DIR: .uv-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: python -m pip install uv

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --group dev --python 3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Python format
        run: uv run black --check .

      - name: Python lint
        run: uv run ruff check .

      - name: Python types
        run: uv run mypy .

      - name: Python dependency check
        run: uv run python -m pip check

      - name: Django checks
        run: uv run python manage.py check

      - name: Django deploy security checks
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: Django migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Backend tests
        run: uv run pytest -q -p no:cacheprovider --ignore=tests/e2e

      - name: Frontend format
        working-directory: frontend
        run: npm run format

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend stylelint
        working-directory: frontend
        run: npm run stylelint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend accessibility smoke
        working-directory: frontend
        run: |
          mkdir -p ../.tmp
          node .output/server/index.mjs > ../.tmp/nuxt-a11y.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat ../.tmp/nuxt-a11y.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000 >/dev/null
          MOKSHA_FRONTEND_BASE_URL=http://127.0.0.1:3000 npm run axe

      - name: Nuxt browser E2E
        run: uv run pytest tests/e2e -q -p no:cacheprovider

      - name: README validation
        run: python scripts/validate_readmes.py --root . --warnings-as-errors

      - name: Verify validation changed no tracked files
        run: git diff --exit-code
